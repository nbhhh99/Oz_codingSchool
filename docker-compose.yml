services:
  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    # 개발용 실행: DB 마이그레이션 반영 후 --reload 로 기동해
    # 로컬에서 수정한 코드가 컨테이너에 즉시 반영되도록 한다.
    command:
      - sh
      - -c
      - |
        uv run --no-sync alembic upgrade head &&
        uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-dir worker
    ports:
      - "8000:8000"
    volumes:
      - .:/app                      # 로컬 볼륨을 컨테이너 내 /app 경로로 마운트
      - media_volume:/app/media     # 업로드 파일(X-Ray 등)은 별도 볼륨에 영속화
    env_file:
      - .env
    environment:
      DB_HOST: mysql                     # compose 네트워크 상 mysql 서비스명으로 접속
      REDIS_URL: redis://redis:6379/0    # 폐렴 예측 작업 큐 / 결과 Pub-Sub
      WATCHFILES_FORCE_POLLING: "true"   # bind-mount 환경에서 --reload 파일 변경 감지 보장
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # AI 추론 워커 (Consumer). FastAPI 와 분리된 프로세스/이미지로,
  # Redis 작업 큐에서 작업을 꺼내 SimpleCNN 추론 후 결과를 Pub/Sub 으로 발행한다.
  # 처리량을 늘리려면:  docker compose up --scale ai-worker=3
  ai-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    # 개발 중 워커 코드 수정이 바로 반영되도록 소스를 bind-mount 한다.
    # (이미지에는 이미 worker/ 가 들어있지만, 볼륨이 그 위를 덮어쓴다.)
    command: ["python", "-m", "worker.main"]
    volumes:
      - ./worker:/app/worker        # 워커 소스
      - media_volume:/app/media     # FastAPI 가 저장한 X-Ray 를 같은 경로로 읽는다
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PREDICTION_QUEUE_KEY: pneumonia:task_queue
      MEDIA_BASE_DIR: /app
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_volume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    # AOF 로 작업 큐를 디스크에 영속화 (컨테이너 재시작에도 큐 유지)
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_volume:
  media_volume:
  redis_volume:
